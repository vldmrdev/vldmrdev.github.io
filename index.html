<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello World</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: #d0d0d0;
            font-family: "Courier New", monospace;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        pre {
            color: #e0e0e0;
            font-size: clamp(9px, 2vw, 18px);
            line-height: 1.2;
            text-align: left;
            display: inline-block;
        }

        .footer {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: #666;
            line-height: 2;
        }

        .footer a {
            color: #999;
            text-decoration: none;
        }

        .footer a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .status {
            color: #888;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

<main class="container">

<pre>
Hello World.
</pre>

</main>

<footer class="footer">
    <div class="status">[ UNDER CONSTRUCTION ]</div>
    <div>
        <a href="https://github.com/vldmrdev" target="_blank" rel="noopener noreferrer">
            github.com/vldmrdev
        </a>
    </div>
</footer>

</body>
</html>
